---
- name: bootstrap mrover-esw dev machine
  hosts: localhost
  connection: local
  become: false
  vars:
    esw_root: "{{ playbook_dir }}/.."
    install_dir: "{{ esw_root }}/install"
    unpack_dir: /var/tmp/mrover-esw-installers
    arm_gnu_version: 14.3.rel1
    arm_gnu_name: "arm-gnu-toolchain-{{ arm_gnu_version }}-{{ arm_gnu_host }}-arm-none-eabi"
    arm_gnu_link: "https://developer.arm.com/-/media/Files/downloads/gnu/{{ arm_gnu_version }}/binrel/{{ arm_gnu_name }}.tar.xz"
    arm_gnu_path: /usr/local
    desktop_dir: "{{ ansible_facts.env.HOME }}/.local/share/applications"

  pre_tasks:
    - name: load the variables for this operating system
      ansible.builtin.include_vars: "vars/{{ ansible_facts.system }}.yml"
      tags: always

  tasks:
    - import_tasks: tasks/packages.yml
      tags: packages
    - import_tasks: tasks/clang-format.yml
      tags: clang-format
    - import_tasks: tasks/uv.yml
      tags: uv
    - import_tasks: tasks/arm-toolchain.yml
      tags: arm-toolchain
    - import_tasks: tasks/submodules.yml
      tags: submodules
    - import_tasks: tasks/stm32cube-install-dir.yml
      tags: stm32cube
    - import_tasks: tasks/path-profile.yml
      tags: path-profile
    - import_tasks: tasks/desktop-entries.yml
      tags: desktop-entries
      when: ansible_facts.system == "Linux"
    - import_tasks: tasks/vscode.yml
      tags: vscode
    - import_tasks: tasks/python-venv.yml
      tags: python-venv

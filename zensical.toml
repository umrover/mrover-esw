[project]
site_name = "MRover ESW"
docs_dir = "docs"
site_dir = "site" # where the site will be built to
site_url = "https://umrover.github.io/mrover-esw"
repo_url = "https://github.com/umrover/mrover-esw"
repo_name = "umrover/mrover-esw"
edit_uri = "edit/main/docs/" # by default zensical uses master, but our default branch is main

nav = [
  { Home = "index.md" },
  { "Getting Started" = [
    { Introduction = "getting-started/intro.md" },
    { STM32Cube = "getting-started/stm32cube/index.md" },
    { "Starter Projects" = [
      { LED = "getting-started/starter/led/index.md" },
      { Servo = [
        { "Part 1: PWM" = "getting-started/starter/servo/part1-pwm.md" },
        { "Part 2: CAN" = "getting-started/starter/servo/part2-can.md" },
      ]},
      { "Temp-Humidity" = "getting-started/starter/temp-humidity/index.md" },
    ]},
  ]},
  { Projects = [
    { Overview = "projects/overview26.md" },
    { Boards = [
      { Overview = "projects/boards/index.md" },
      { ABS = "projects/boards/abs.md" },
      { BMC = "projects/boards/bmc.md" },
      { LIM = "projects/boards/lim.md" },
      { PDB = "projects/boards/pdlb.md" },
      { Science = "projects/boards/science.md" },
    ]},
  ]},
  { Reference = [
    { "Build System" = [
      { Overview = "reference/build/index.md" },
      { "Project Anatomy" = "reference/build/project-layout.md" },
      { "Toolchain and Presets" = "reference/build/toolchain.md" },
      { "Generated Libraries" = "reference/build/codegen.md" },
      { "Build Script Internals" = "reference/build/build-script.md" },
      { "Continuous Integration" = "reference/build/ci.md" },
    ]},
    { Configuration = [
      { Overview = "reference/config/index.md" },
      { "Register Definitions" = "reference/config/schema.md" },
      { "Device Values" = "reference/config/devices.md" },
      { "CAN Configuration Interface" = "reference/config/can-interface.md" },
    ]},
    { "Python Tools" = [
      { Overview = "reference/python/index.md" },
      { "esw.can" = "reference/python/can.md" },
      { "esw.config" = "reference/python/config.md" },
      { "esw.cubemx" = "reference/python/cubemx.md" },
      { "esw.stlink" = "reference/python/stlink.md" },
      { "esw.visualization" = "reference/python/visualization.md" },
      { "Script Reference" = "reference/python/scripts.md" },
    ]},
    { "Maintaining Documentation" = "reference/maintaining-docs.md" },
  ]},
  { "Useful Information" = [
    { "Build Tools" = "info/build.md" },
    { Timers = "info/timers.md" },
    { "Communication Protocols" = "info/communication-protocols/index.md" },
    { "Brushed Motors" = "info/brushed.md" },
    { "Brushless Motors" = "info/brushless.md" },
    { "Nucleo Information" = "info/nucleos.md" },
    { "STM32 Boot" = "info/stm32-boot.md" },
  ]},
]

[project.theme]
variant = "modern"
logo = "img/logo.webp"
favicon = "img/favicon.ico"
features = [
  "content.action.edit", # button on each page to edit the page on GitHub
  "content.action.view", # button on each page to view the page on GitHub
  "content.code.copy", # copy button on code blocks
  "navigation.tabs" # show top-level nav items as tabs instead of a dropdown
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# admonitions such as notes, warnings, etc
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

# code highlighting
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

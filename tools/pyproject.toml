[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esw"
version = "0.1.0"
description = "utilities for mrover esw software"
authors = [
    { name = "Michigan Mars Rover Embedded Software Team" }
]
requires-python = ">=3.12"

dependencies = [
    "Jinja2>=3.1.6",
    "cantools>=41.0.2",
    "matplotlib>=3.10.8",
    "moteus>=0.3.98",
    "moteus-gui>=0.3.98",
    "pyserial>=3.5",
    "python-can>=4.6.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "ty>=0.0.11",
]
# only what `zensical build` needs; CI syncs this alone with --only-group docs
docs = [
    "zensical>=0.0.53",
]

[tool.uv]
# uv.lock is revision 3 and uses [dependency-groups]
required-version = ">=0.12"   # floor only; the exact pin lives in Dockerfile.arm-gnu
# a plain `uv sync` gives developers the full environment
default-groups = ["dev", "docs"]

[tool.setuptools.packages.find]
include = ["esw*"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"

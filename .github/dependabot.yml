version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "tool"
    labels: ["dependencies"]

updates:
  - package-ecosystem: "uv"
    directory: "/tools"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      # ubuntu is pinned at 24.04
      - dependency-name: "ubuntu"

name: site

on:
  push:
    branches: [ "main" ]
    paths:
      - docs/**
      - zensical.toml
      - tools/pyproject.toml
      - tools/uv.lock
      - tools/.python-version
      - .github/workflows/site.yml
  pull_request:
    branches: [ "main" ]
    paths:
      - docs/**
      - zensical.toml
      - tools/pyproject.toml
      - tools/uv.lock
      - tools/.python-version
      - .github/workflows/site.yml
  workflow_dispatch: {}  # manual trigger for testing after merge

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: resolve the pinned uv version
        id: uv
        run: |
          version=$(sed -nE 's|^FROM ghcr\.io/astral-sh/uv:(\S+) .*|\1|p' Dockerfile.arm-gnu)
          test -n "$version" || { echo "could not read the uv pin from Dockerfile.arm-gnu" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: sync python env
        run: uv sync --project tools --locked --only-group docs

      - name: zensical build
        run: uv run --project tools --no-sync zensical build --clean

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: configure pages
        uses: actions/configure-pages@v6

      - name: deploy to pages
        uses: actions/deploy-pages@v5
        id: deployment
